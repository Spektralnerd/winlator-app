name: Winlator armv7

# Baut die 32-Bit-Varianten von Winlator:
#   armv7hybrid  32-Bit-App + originaler 64-Bit-Unterbau (für 32-Bit-Android auf 64-Bit-Kernel)
#   armv7        alles 32 Bit: Box86 + i386-Wine + armhf-Root-FS
# Der 32-Bit-Unterbau liegt im Release "armv7-rootfs" (siehe armv7/README.md),
# die APKs landen im Release "armv7-apk" (Vorabversion).

on:
  push:
    branches: [armv7]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: armv7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: armv7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android NDK r24 und CMake 3.22.1
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;24.0.8215888" "cmake;3.22.1" "platforms;android-35" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/24.0.8215888" >> "$GITHUB_ENV"

      - name: FluidSynth für armeabi-v7a (MIDI)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash armv7/scripts/fetch-fluidsynth.sh || echo "::warning::FluidSynth nicht geladen, MIDI bleibt stumm"

      - name: APK armv7hybrid
        run: |
          mkdir -p out
          bash ./gradlew --no-daemon --stacktrace assembleDebug -PwinlatorArch=armv7hybrid
          cp app/build/outputs/apk/debug/app-debug.apk out/Winlator-11.2-armv7hybrid.apk

      - name: 32-Bit-Unterbau holen (Release armv7-rootfs)
        id: rootfs
        run: |
          mkdir -p app/src/armv7/assets
          if gh release download armv7-rootfs -R "$GITHUB_REPOSITORY" -p 'armv7-assets.tar' -D /tmp; then
            tar -xf /tmp/armv7-assets.tar -C app/src/armv7/assets
            ls -la app/src/armv7/assets app/src/armv7/assets/*
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Noch kein 32-Bit-Unterbau im Release armv7-rootfs, armv7-APK wird übersprungen"
          fi

      - name: APK armv7
        if: steps.rootfs.outputs.ok == '1'
        run: |
          bash ./gradlew --no-daemon --stacktrace clean assembleDebug -PwinlatorArch=armv7
          cp app/build/outputs/apk/debug/app-debug.apk out/Winlator-11.2-armv7.apk

      - name: Inhalt prüfen
        run: |
          for apk in out/*.apk; do
            echo "== $apk ($(du -h "$apk" | cut -f1))"
            unzip -l "$apk" | grep -E 'lib/|assets/(rootfs|box|graphics_driver|container_pattern)' | awk '{print $1, $4}' | head -60
          done

      - name: Release armv7-apk aktualisieren
        run: |
          TAG=armv7-apk
          NOTES="Automatischer Build von $(git rev-parse --short HEAD) ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" out/*.apk --clobber -R "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes "$NOTES" -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" out/*.apk --prerelease --title "Winlator armv7 (Testbuilds)" --notes "$NOTES" --target armv7 -R "$GITHUB_REPOSITORY"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: out/*.apk
