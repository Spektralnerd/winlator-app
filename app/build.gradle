apply plugin: 'com.android.application'

// Zielarchitektur, wählbar mit -PwinlatorArch=...
//   arm64        Original: arm64-v8a-App, Box64 + WoW64-Wine (Standard; nur Gladio-Korrekturen)
//   armv7hybrid  armeabi-v7a-App mit dem originalen 64-Bit-Unterbau
//                (für 32-Bit-Android auf einem 64-Bit-Kernel)
//   armv7        alles 32 Bit: armeabi-v7a-App, Box86 + i386-Wine, Win32-Präfix
def winlatorArch = (project.findProperty('winlatorArch') ?: 'arm64').toString()
if (!['arm64', 'armv7hybrid', 'armv7'].contains(winlatorArch)) {
    throw new GradleException("Unbekannte winlatorArch '${winlatorArch}' (erlaubt: arm64, armv7hybrid, armv7)")
}
def appAbi = winlatorArch == 'arm64' ? 'arm64-v8a' : 'armeabi-v7a'
def x86Only = winlatorArch == 'armv7'
// Für 32 Bit vorgebaute JNI-Bibliotheken (FluidSynth, PulseAudio) und Assets liegen getrennt
// vom Original, damit dessen Dateien unverändert bleiben (siehe armv7/README.md).
def armv7Dir = file('src/armv7')

android {
    namespace 'com.winlator'
    compileSdk 35

    defaultConfig {
        applicationId 'com.winlator'
        // 32 Bit: ab Android 7.0 (API 24); was erst ab 8.0 geht (AHardwareBuffer, Pointer-Capture,
        // @CriticalNative, Benachrichtigungskanäle) wird zur Laufzeit geprüft
        minSdkVersion(appAbi == 'arm64-v8a' ? 26 : 24)
        targetSdkVersion 28
        versionCode 33
        versionName "11.2" + (winlatorArch == 'arm64' ? '' : "-${winlatorArch}")

        buildConfigField "String", "WINLATOR_ARCH", "\"${winlatorArch}\""
        buildConfigField "boolean", "X86_ONLY", "${x86Only}"

        externalNativeBuild {
            cmake {
                arguments "-DWINLATOR_ARCH=${winlatorArch}",
                          "-DWINLATOR_JNILIBS_DIR=" + (appAbi == 'arm64-v8a' ? file('src/main/jniLibs').path : new File(armv7Dir, 'jniLibs').path)
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    // Fester Schlüssel für die Builds aus GitHub Actions, damit sich neue APKs über alte
    // installieren lassen (sonst erzeugt jeder Bauhost einen eigenen Debug-Schlüssel)
    def armv7Keystore = rootProject.file('armv7/signing/debug.keystore')
    signingConfigs {
        debug {
            if (armv7Keystore.isFile()) {
                storeFile armv7Keystore
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            ndk {
                abiFilters appAbi
            }
        }
    }

    sourceSets {
        debug {
            if (appAbi != 'arm64-v8a') {
                jniLibs.srcDirs += new File(armv7Dir, 'jniLibs').path
            }
            if (x86Only) {
                // Assets aus src/armv7/assets überdecken gleichnamige Dateien aus src/main/assets
                assets.srcDirs += new File(armv7Dir, 'assets').path
                res.srcDirs += new File(armv7Dir, 'res').path
            }
        }
    }

    androidResources {
        if (x86Only) {
            // reine 64-Bit-Bestandteile nicht ins 32-Bit-APK packen
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:!box64:!turnip-26.2.0.tzst'
        }
    }

    lintOptions {
        checkReleaseBuilds false
        if (appAbi != 'arm64-v8a') {
            // nur API-Prüfungen (NewApi) für das niedrigere minSdk der 32-Bit-Builds,
            // aufgerufen von GitHub Actions mit "lintDebug"
            lintConfig rootProject.file('armv7/lint.xml')
            abortOnError false
            xmlReport true
            htmlReport false
        }
    }

    ndkVersion '24.0.8215888'

    externalNativeBuild {
        cmake {
            version '3.22.1'
            path 'src/main/cpp/CMakeLists.txt'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.4.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'com.github.luben:zstd-jni:1.5.2-3@aar'
    implementation 'org.tukaani:xz:1.7'
    implementation 'org.apache.commons:commons-compress:1.20'
    implementation 'androidx.lifecycle:lifecycle-process:2.5.1'
}
